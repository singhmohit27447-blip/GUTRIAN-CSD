name: Build GUTRIAN CSD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q GUTRIAN_CSD_Android_V1.zip
          cp -r GUTRIAN_CSD_Android/. ./

      - name: Fix Android Project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- Fix MainActivity.kt ----------
          p = Path("app/src/main/java/com/gutrian/csd/MainActivity.kt")
          s = p.read_text()

          # Make model classes accessible
          s = s.replace(
              "private data class CardRecord(",
              "data class CardRecord("
          )

          s = s.replace(
              "private data class EventRecord(",
              "data class EventRecord("
          )

          # Avoid experimental TopAppBar compilation issue
          s = s.replace(
              'Scaffold(topBar = { TopAppBar(',
              '@OptIn(ExperimentalMaterial3Api::class)\n        Scaffold(topBar = { TopAppBar('
          )

          p.write_text(s)

          # ---------- Fix Gradle JVM targets ----------
          p = Path("app/build.gradle.kts")
          s = p.read_text()

          old = '''android { namespace = "com.gutrian.csd"; compileSdk = 35
              defaultConfig { applicationId = "com.gutrian.csd"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1.0.0" }
          }'''

          new = '''android {
              namespace = "com.gutrian.csd"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.gutrian.csd"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
          }'''

          if old in s:
              s = s.replace(old, new)
          else:
              print("Android block already modified or format changed.")

          p.write_text(s)

          print("All Android project fixes applied.")

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUTRIAN-CSD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
