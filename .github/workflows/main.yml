name: Build GUTRIAN CSD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract GUTRIAN CSD Admin Fix
        run: |
          set -e

          ZIP_FILE="GUTRIAN_CSD_ADMIN_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          rm -rf build_project
          mkdir -p build_project

          unzip -q "$ZIP_FILE" -d build_project

          echo "Extracted files:"
          find build_project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=$(find build_project -name settings.gradle.kts -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find build_project -maxdepth 5 -type f
            exit 1
          fi

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify Firebase Android configuration
        run: |
          set -e

          test -f "$ANDROID_PROJECT/app/google-services.json"

          echo "Firebase configuration found."
          grep -q '"com.gutrian.csd"' "$ANDROID_PROJECT/app/google-services.json"

          echo "Package name verified: com.gutrian.csd"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show project files
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Build GUTRIAN CSD Debug APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug \
            -Pandroid.injected.invoked.from.ide=true

      - name: Verify APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload GUTRIAN CSD APK
        uses: actions/upload-artifact@v4
        with:
          name: GUTRIAN-CSD-APK
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
