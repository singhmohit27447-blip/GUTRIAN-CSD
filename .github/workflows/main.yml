name: Build GUTRIAN CSD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Firebase Android project
        run: |
          unzip -q GUTRIAN_CSD_FIREBASE_ANDROID_FIXED.zip
          cp -r GUTRIAN_CSD_Android/. ./

      - name: Verify Firebase Android configuration
        run: |
          test -f app/google-services.json
          test -f app/src/main/java/com/gutrian/csd/MainActivity.kt
          echo "Firebase Android configuration found."

          grep -q '"project_id": "card-flow-manger"' app/google-services.json
          grep -q '"package_name": "com.gutrian.csd"' app/google-services.json

          echo "Firebase project and Android package verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build GUTRIAN CSD APK
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUTRIAN-CSD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
