name: Build GUTRIAN CSD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Firebase Android project
        run: |
          unzip -q GUTRIAN_CSD_FIREBASE_ANDROID_FIXED.zip
          cp -r GUTRIAN_CSD_Android/. ./

      - name: Fix Android Java and Kotlin settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Remove old android block if present
          old = '''android { namespace = "com.gutrian.csd"; compileSdk = 35
              defaultConfig { applicationId = "com.gutrian.csd"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1.0.0" }
          }'''

          new = '''android {
              namespace = "com.gutrian.csd"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  allWarningsAsErrors = false
              }

              defaultConfig {
                  applicationId = "com.gutrian.csd"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1.0"
              }
          }'''

          if old in s:
              s = s.replace(old, new)
          elif "compileOptions" not in s:
              start = s.find("android {")
              if start >= 0:
                  end = s.find("\n}", start)
                  if end >= 0:
                      end = end + 2
                      s = s[:start] + new + s[end:]

          p.write_text(s)

          # Fix MainActivity Kotlin opt-in if required
          p = Path("app/src/main/java/com/gutrian/csd/MainActivity.kt")
          s = p.read_text()

          optin = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)"

          if optin not in s:
              s = optin + "\n\n" + s

          s = s.replace(
              "private data class CardRecord(",
              "data class CardRecord("
          )

          s = s.replace(
              "private data class EventRecord(",
              "data class EventRecord("
          )

          p.write_text(s)

          print("Android Java/Kotlin JVM target fixed to 17.")
          PY

      - name: Verify Firebase Android configuration
        run: |
          test -f app/google-services.json
          test -f app/src/main/java/com/gutrian/csd/MainActivity.kt
          grep -q '"project_id": "card-flow-manger"' app/google-services.json
          grep -q '"package_name": "com.gutrian.csd"' app/google-services.json
          echo "Firebase configuration verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build GUTRIAN CSD APK
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUTRIAN-CSD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
