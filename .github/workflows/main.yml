name: Build GUTRIAN CSD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract GUTRIAN CSD Admin Fix
        run: |
          set -e

          ZIP_FILE="GUTRIAN_CSD_FINAL_SOURCE_V3_1_FIXED2.zip"
          test -f "$ZIP_FILE"

          rm -rf build_project
          mkdir -p build_project

          unzip -q "$ZIP_FILE" -d build_project

          echo "Extracted project:"
          find build_project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=$(find build_project \
            -name settings.gradle.kts \
            -type f \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find build_project -maxdepth 5 -type f
            exit 1
          fi

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Firebase configuration
        run: |
          set -e

          test -f "$ANDROID_PROJECT/app/google-services.json"

          grep -q '"com.gutrian.csd"' \
            "$ANDROID_PROJECT/app/google-services.json"

          echo "Firebase Android configuration OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f 2>/dev/null | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GUTRIAN CSD APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload GUTRIAN CSD APK
        uses: actions/upload-artifact@v4
        with:
          name: GUTRIAN-CSD-APK
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
